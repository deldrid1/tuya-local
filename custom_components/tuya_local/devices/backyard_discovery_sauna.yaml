name: Sauna heater
products:
  - id: 0envtxjyq7wn7h6t
    manufacturer: Backyard Discovery
    model: BYD Sauna Heater
entities:
  - entity: climate
    translation_only_key: heater
    heat_duration_source: default_heat_duration
    dps:
      - id: 26
        name: hvac_mode
        type: integer
        unit: min
        range:
          min: 0
          max: 60
        mapping:
          - dps_val: 0
            value: "off"
          - dps_val: 60
            value: heat
          - value: heat
            step: 5
      - id: 101
        name: hvac_action
        type: integer
        unit: min
        mapping:
          - dps_val: 0
            value: "off"
          - value: heating
      - id: 102
        name: temperature
        type: integer
        unit: C
        optional: true
        range:
          min: 0
          max: 90
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_set_f
                range:
                  min: 32
                  max: 194
                step: 9
      - id: 103
        name: current_temperature
        type: integer
        optional: true
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_current_f
      - id: 104
        name: temperature_unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 106
        name: temp_set_f
        type: integer
        unit: F
        hidden: true
        range:
          min: 32
          max: 194
        mapping:
          - step: 9
      - id: 105
        name: temp_current_f
        type: integer
        unit: F
        hidden: true
  - entity: switch
    name: Controls
    icon: "mdi:power"
    dps:
      - id: 20
        name: switch
        type: boolean
  - entity: sensor
    name: Current temperature
    class: temperature
    dps:
      - id: 103
        name: sensor
        type: integer
        unit: C
        optional: true
        class: measurement
        mapping:
          - constraint: unit
            conditions:
              - dps_val: f
                value_redirect: temp_current_f
      - id: 104
        name: unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 105
        name: temp_current_f
        type: integer
        unit: F
        hidden: true
  - entity: number
    name: Setpoint temperature
    class: temperature
    dps:
      - id: 102
        name: value
        type: integer
        unit: C
        optional: true
        range:
          min: 0
          max: 90
        mapping:
          - constraint: unit
            conditions:
              - dps_val: f
                value_redirect: temp_set_f
                range:
                  min: 32
                  max: 194
                step: 9
      - id: 104
        name: unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 106
        name: temp_set_f
        type: integer
        unit: F
        hidden: true
        range:
          min: 32
          max: 194
        mapping:
          - step: 9
  - entity: number
    translation_key: timer
    class: duration
    mode: slider
    dps:
      - id: 26
        name: value
        type: integer
        unit: min
        range:
          min: 0
          max: 60
        mapping:
          - step: 5
  - entity: number
    name: Default heat timer
    class: duration
    category: config
    source: default_heat_duration
    unit: min
    default: 60
    range:
      min: 5
      max: 60
    step: 5
  - entity: sensor
    name: WiFi signal strength
    class: signal_strength
    category: diagnostic
    hidden: true
    source: cloud_signal_strength
    unit: dBm
    state_class: measurement
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 101
        name: sensor
        type: integer
        unit: min
  - entity: select
    name: Display mode
    category: config
    hidden: true
    dps:
      - id: 21
        name: option
        type: string
        mapping:
          - dps_val: hide
            value: Hidden
          - dps_val: bright
            value: Brightness
          - dps_val: temp
            value: Temperature
          - dps_val: countdown
            value: Countdown
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 104
        name: option
        type: string
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 107
        name: sensor
        type: bitfield
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 107
        name: fault_code
        type: bitfield
        optional: true
